server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-lived caching for hashed assets so deploys that change only the
  # bundle get a cache-bust on the new file names.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be re-validated so deploys roll out cleanly.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # SPA fallback — every non-asset path serves index.html so React Router
  # can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
